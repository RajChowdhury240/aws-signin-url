[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "aws-signin-url"
version = "0.1.0"
description = "Turn AWS credentials (IAM user keys, roles, or named profiles) into a one-click AWS Management Console sign-in URL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Chowdhury Faizal Ahammed" }]
dependencies = ["boto3>=1.26"]
keywords = ["aws", "console", "sts", "federation", "signin", "iam"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/RajChowdhury240/aws-signin-url"
Issues = "https://github.com/RajChowdhury240/aws-signin-url/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
aws-signin-url = "aws_signin_url.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_signin_url"]

[tool.pytest.ini_options]
testpaths = ["tests"]
